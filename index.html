<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LifeMap — สมุดชีวิตและ Future Profile</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg: #f6f6f4;
      --ink: #1a1a1a;
      --ink-soft: #666;
      --brand-green: #C8FF33;
      --card: #ffffff;
      --line: #e6e6e2;
      --r: 18px;

      /* Profile default theme */
      --accent: #FF5C8A;
      --accent-soft: #FFE3EA;
      --accent-deep: #9A2A4D;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      position: relative;
    }

    /* Header */
    header {
      padding: 14px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-badge {
      font-family: 'Prompt', sans-serif;
      font-weight: 800;
      font-size: 16px;
      background: var(--brand-green);
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.08);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .logo-badge span { font-weight: 500; opacity: 0.8; }
    .prog-wrap {
      flex: 1;
      margin: 0 14px;
      height: 7px;
      background: #e3e3df;
      border-radius: 99px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: var(--brand-green);
      width: 0%;
      transition: width 0.3s ease;
    }
    .step-count {
      font-family: 'Prompt', sans-serif;
      font-size: 12.5px;
      color: var(--ink-soft);
      min-width: 40px;
      text-align: right;
      font-weight: 600;
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 0 100px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }
    .screen.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typography */
    h1 {
      font-family: 'Prompt', sans-serif;
      font-weight: 800;
      font-size: 26px;
      line-height: 1.3;
      margin: 0 0 10px;
      color: var(--ink);
    }
    h2 {
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.35;
      margin: 0 0 12px;
      color: var(--ink);
    }
    p.lead {
      color: var(--ink);
      font-size: 15.5px;
      line-height: 1.6;
      margin: 0 0 14px;
    }
    p.muted {
      color: var(--ink-soft);
      font-size: 13.5px;
      line-height: 1.55;
      margin: 8px 0;
    }

    /* Cards & Containers */
    .card {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 16px 18px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Consent Checkboxes */
    .consent-group { margin: 16px 0; }
    .consent-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin: 10px 0;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .consent-item.req {
      border-color: #E2E2DC;
      background: #FAFAF7;
    }
    .consent-item.checked {
      border-color: var(--brand-green);
      background: #F8FFE5;
    }
    .consent-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: #1a1a1a;
      flex-shrink: 0;
      cursor: pointer;
    }
    .consent-item-text b {
      font-family: 'Prompt', sans-serif;
      font-size: 14.5px;
      display: block;
      margin-bottom: 2px;
    }
    .consent-item-text span {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.45;
      display: block;
    }
    .tag-req {
      display: inline-block;
      background: #FF4757;
      color: #fff;
      font-size: 10.5px;
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tag-opt {
      display: inline-block;
      background: #e6e6e2;
      color: var(--ink-soft);
      font-size: 10.5px;
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Options & Radio Cards */
    .opt {
      display: block;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin: 10px 0;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.48;
      transition: all 0.15s ease;
    }
    .opt:hover {
      border-color: var(--brand-green);
      background: #FBFFE5;
    }
    .opt.sel {
      border-color: var(--brand-green);
      background: #F4FFCE;
      font-weight: 500;
      box-shadow: 0 0 0 3px rgba(200,255,51,0.35);
    }

    /* Form Fields */
    label.field {
      display: block;
      margin: 14px 0;
    }
    label.field span.label-text {
      display: block;
      font-size: 13.5px;
      color: var(--ink-soft);
      margin-bottom: 6px;
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
    }
    label.field span.req::after { content: " *"; color: #FF4757; }
    
    input[type=text], input[type=email] {
      width: 100%;
      padding: 13px 14px;
      font-size: 15.5px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-family: inherit;
      background: #fff;
      color: var(--ink);
      transition: border-color 0.15s ease;
    }
    input[type=text]:focus, input[type=email]:focus {
      outline: none;
      border-color: var(--brand-green);
      box-shadow: 0 0 0 3px rgba(200,255,51,0.35);
    }

    /* Tiered Grade Picker */
    .tier-card {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      margin: 8px 0;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }
    .tier-card.expanded { border-color: var(--brand-green); background: #FBFFE5; }
    .tier-card.has-pick { border-color: var(--brand-green); background: #F4FFCE; box-shadow: 0 0 0 3px rgba(200,255,51,0.3); }
    .tier-head {
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
      font-size: 15px;
    }
    .tier-head .chev { color: #999; font-size: 13px; transition: transform 0.2s; }
    .tier-card.expanded .tier-head .chev { transform: rotate(180deg); color: var(--ink); }
    .pick-badge {
      background: var(--brand-green);
      color: var(--ink);
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 99px;
      margin-left: 8px;
    }
    .tier-items {
      display: none;
      padding: 0 12px 12px;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .tier-card.expanded .tier-items { display: grid; }
    .opt-year {
      background: #fff;
      border: 1.5px solid var(--brand-green);
      border-radius: 10px;
      padding: 9px 4px;
      text-align: center;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      transition: all 0.12s ease;
    }
    .opt-year.sel {
      background: var(--brand-green);
      border-color: var(--brand-green);
      box-shadow: 0 0 0 2px rgba(200,255,51,0.5);
    }

    /* Gender Selection Grid */
    .gender-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 6px; }
    .gender-opt {
      padding: 11px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      background: #fff;
      font-family: 'Prompt', sans-serif;
    }
    .gender-opt.sel { border-color: var(--brand-green); background: #F4FFCE; font-weight: 600; }

    /* Scale 1-5 Buttons */
    .scale-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 14px 0;
    }
    .scale-opt {
      aspect-ratio: 1/1;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Prompt', sans-serif;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      color: #666;
      transition: all 0.15s ease;
    }
    .scale-opt.sel {
      background: var(--brand-green);
      border-color: var(--brand-green);
      color: var(--ink);
      box-shadow: 0 0 0 3px rgba(200,255,51,0.35);
    }
    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: -4px;
      font-family: 'Prompt', sans-serif;
    }

    /* Fixed Footer Navigation */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(246, 246, 244, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    footer:empty { display: none; }

    button.btn {
      flex: 1;
      padding: 16px;
      font-size: 16px;
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 14px;
      cursor: pointer;
      background: var(--ink);
      color: #fff;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button.btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink-soft);
      font-weight: 500;
    }
    button.btn:disabled {
      background: #cfcfca;
      border-color: #cfcfca;
      color: #fff;
      cursor: not-allowed;
      box-shadow: none;
    }
    button.btn:not(:disabled):hover {
      background: var(--brand-green);
      color: var(--ink);
      border-color: var(--brand-green);
      box-shadow: 0 6px 18px rgba(200, 255, 51, 0.4);
    }
    button.btn.ghost:not(:disabled):hover {
      background: transparent;
      color: var(--ink);
      box-shadow: none;
    }
    button.btn:not(:disabled):active { transform: scale(0.98); }

    /* Dashboard Result Styling */
    .dashboard-header {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .user-greeting {
      font-size: 13.5px;
      color: var(--ink-soft);
      font-family: 'Prompt', sans-serif;
      margin-bottom: 2px;
    }
    .passport-title {
      font-family: 'Prompt', sans-serif;
      font-weight: 800;
      font-size: 22px;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .profile-banner {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      border-radius: 18px;
      padding: 20px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .profile-banner-inner {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      color: var(--ink);
    }
    .profile-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .profile-name-en {
      font-family: 'Anton', sans-serif;
      font-size: 26px;
      letter-spacing: 1px;
      color: var(--accent);
      margin: 0 0 2px;
      line-height: 1.1;
    }
    .profile-name-th {
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--ink-soft);
      margin: 0 0 10px;
    }

    .widget-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 14px 0;
    }
    .widget-card {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }
    .widget-title {
      font-family: 'Prompt', sans-serif;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }
    .widget-val {
      font-family: 'Prompt', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: var(--ink);
    }

    .mission-card {
      background: var(--accent-soft);
      border: 1.5px solid var(--accent);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
    }
    .mission-tag {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .mission-title {
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent-deep);
      margin-bottom: 4px;
    }

    .parent-code-box {
      background: #FFF9E6;
      border: 1.5px dashed #F0C040;
      border-radius: 14px;
      padding: 14px;
      margin: 14px 0;
      text-align: center;
    }
    .parent-code-val {
      font-family: 'Anton', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: #B88600;
      margin: 4px 0;
    }

    .action-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    /* Loader */
    .loader-wrap {
      text-align: center;
      padding: 60px 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e3e3df;
      border-top-color: var(--brand-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Links & Buttons */
    .link-subtle {
      color: var(--ink-soft);
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      text-align: center;
      display: block;
      margin-top: 12px;
    }
  </style>
</head>
<body>

    <header>
      <div class="logo-badge">Life<span>Map</span></div>
      <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
      <div class="step-count" id="stepCount"></div>
    </header>

    <main id="mainContainer"></main>

    <footer id="footerNav"></footer>
  </div>

    function renderStep() {
      const s = steps[state.step];
      const main = document.getElementById('mainContainer');
      updateProgress();

      if (s.type === 'welcome' || s.type === 'identity') {
        main.innerHTML = s.render();
        s.bind?.();
      } else if (s.type === 'choice') {
        main.innerHTML = `
          <div class="screen active">
            <h2>${s.title}</h2>
            <div id="optsContainer">
              ${s.options.map(o => `
                <div class="opt ${state.answers[s.key] === o ? 'sel' : ''}" data-val="${escapeHtml(o)}">${o}</div>
              `).join('')}
            </div>
          </div>
        `;
        document.querySelectorAll('#optsContainer .opt').forEach(el => {
          el.addEventListener('click', () => {
            document.querySelectorAll('#optsContainer .opt').forEach(x => x.classList.remove('sel'));
            el.classList.add('sel');
            state.answers[s.key] = el.dataset.val;
            renderFooter();
          });
        });
      } else if (s.type === 'scale') {
        main.innerHTML = `
          <div class="screen active">
            <h2>${s.title}</h2>
            <div class="scale-grid">
              ${[1,2,3,4,5].map(n => `<div class="scale-opt ${state.answers[s.key] === n ? 'sel' : ''}" data-val="${n}">${n}</div>`).join('')}
            </div>
            <div class="scale-labels"><span>${s.leftLabel}</span><span>${s.rightLabel}</span></div>
          </div>
        `;
        document.querySelectorAll('.scale-opt').forEach(el => {
          el.addEventListener('click', () => {
            document.querySelectorAll('.scale-opt').forEach(x => x.classList.remove('sel'));
            el.classList.add('sel');
            state.answers[s.key] = parseInt(el.dataset.val);
            renderFooter();
          });
        });
      } else if (s.type === 'submitting') {
        main.innerHTML = `
          <div class="screen active">
            <div class="loader-wrap">
              <div class="spinner"></div>
              <h2>กำลังบันทึกและวิเคราะห์สมุดชีวิต...</h2>
              <p class="muted">ระบบกำลังประมวลผล Future Profile ของคุณ</p>
            </div>
          </div>
        `;
        processSubmission();
        renderFooter();
        return;
      } else if (s.type === 'dashboard') {
        renderDashboard();
        renderFooter();
        return;
      } else if (s.type === 'settings') {
        renderSettings();
        renderFooter();
        return;
      }

      renderFooter();
    }

    function renderFooter() {
      const footer = document.getElementById('footerNav');
      if (state.step >= steps.length - 2) { // submitting or dashboard
        footer.innerHTML = '';
        return;
      }

      const canNext = validateCurrent();
      const isFirst = state.step === 0;
      const nextText = state.step === 1 ? 'เริ่มตอบ Quiz' : 'ถัดไป →';

      footer.innerHTML = `
        ${!isFirst ? `<button class="btn ghost" id="btnBack">← ย้อนกลับ</button>` : ''}
        <button class="btn" id="btnNext" ${canNext ? '' : 'disabled'}>${nextText}</button>
      `;

      document.getElementById('btnBack')?.addEventListener('click', () => {
        state.step--;
        renderStep();
        window.scrollTo({ top: 0, behavior: 'instant' });
      });
      document.getElementById('btnNext')?.addEventListener('click', () => {
        state.step++;
        renderStep();
        window.scrollTo({ top: 0, behavior: 'instant' });
      });
    }

    function validateCurrent() {
      const s = steps[state.step];
      if (s.validate) return s.validate();
      if (s.type === 'choice') return state.answers[s.key] !== null;
      if (s.type === 'scale') return state.answers[s.key] !== null;
      return true;
    }

    function updateProgress() {
      const fill = document.getElementById('progFill');
      const text = document.getElementById('stepCount');
      const total = steps.length - 2; // excluding submission & dashboard
      if (state.step <= 0) {
        fill.style.width = '0%';
        text.textContent = '';
      } else if (state.step <= total) {
        const pct = Math.round((state.step / total) * 100);
        fill.style.width = pct + '%';
        text.textContent = `${state.step}/${total}`;
      } else {
        fill.style.width = '100%';
        text.textContent = 'สำเร็จ';
      }
    }

    // Calculation & Backend POST
    function calculateResults() {
      const a = state.answers;
      const counts = { A: 0, B: 0, C: 0, D: 0, E: 0 };
      [a.q1, a.q2, a.q3, a.q4, a.q5].forEach(v => {
        if (v) counts[v[0]] = (counts[v[0]] || 0) + 1;
      });

      const max = Math.max(...Object.values(counts));
      const leaders = ['A','B','C','D','E'].filter(L => counts[L] === max);
      const winner = leaders.length === 1 ? leaders[0]
                    : (a.q5 && leaders.includes(a.q5[0])) ? a.q5[0] : leaders[0];

      const PROFILES_MAP = {
        A: 'Creative Story Builder',
        B: 'Practical Builder',
        C: 'Insight Navigator',
        D: 'Human-Centered Helper',
        E: 'Opportunity Designer'
      };

      const finalProfileKey = PROFILES_MAP[winner];
      const profileInfo = PROFILES_DATA[finalProfileKey];

      // Likert mapping for PMF signal
      const mapLikert = (val) => {
        if (!val) return 3;
        if (val.includes('มาก') || val.includes('แน่นอน') || val.includes('ช่วยมาก')) return 5;
        if (val.includes('อยาก') || val.includes('ช่วยได้') || val.includes('แนะนำ')) return 4;
        if (val.includes('เฉย') || val.includes('ไม่แน่ใจ') || val.includes('กลาง')) return 3;
        if (val.includes('ไม่ค่อย') || val.includes('ช่วยน้อย') || val.includes('คงไม่')) return 2;
        return 1;
      };

      const engagementScore = (mapLikert(a.q7) + mapLikert(a.q8) + mapLikert(a.q9) + mapLikert(a.q10)) / 4;
      let pmfSignal = 'Unclassified';
      if (engagementScore >= 4.5) pmfSignal = 'Strong Signal';
      else if (engagementScore >= 3.5) pmfSignal = 'Positive Signal';
      else if (engagementScore >= 2.5) pmfSignal = 'Weak Signal';
      else pmfSignal = 'No Signal';

      // Generate Parent Invite Code if opt-in
      let inviteCode = '';
      if (state.consents.parent_link) {
        inviteCode = 'LM-' + Math.floor(1000 + Math.random() * 9000);
      }

      state.result = {
        key: finalProfileKey,
        data: profileInfo,
        pmfSignal: pmfSignal,
        score: engagementScore
      };
      state.parentInviteCode = inviteCode;
    }

    function processSubmission() {
      calculateResults();
      if (state.submitted) {
        setTimeout(() => { state.step++; renderStep(); }, 600);
        return;
      }
      state.submitted = true;

      const payload = {
        user_id: state.identity.line_user_id || 'user_' + Date.now(),

        grade: state.identity.grade || '',

        consent_profile: true,
        consent_research: !!state.consents.research,
        consent_parent_link: !!state.consents.parent_link,
        parent_invite_code: state.parentInviteCode || '',
        primary_archetype: state.result.data ? state.result.data.code : '',
        primary_profile_title: state.result.key || '',
        engagement_score: state.result.score || '',
        engagement_signal: state.result.pmfSignal || '',
        wellbeing_anxiety: state.answers.q6 || '',
        q1_answer: state.answers.q1 || '',
        q2_answer: state.answers.q2 || '',
        q3_answer: state.answers.q3 || '',
        q4_answer: state.answers.q4 || '',
        q5_answer: state.answers.q5 || '',
        q7_answer: state.answers.q7 || '',
        q8_answer: state.answers.q8 || '',
        q9_answer: state.answers.q9 || '',
        q10_answer: state.answers.q10 || '',
        q11_answer: state.answers.q11 || '',
        // Fallback keys
        consent: 'ยินยอม',
        q1: state.answers.q1 || '',
        q2: state.answers.q2 || '',
        q3: state.answers.q3 || '',
        q4: state.answers.q4 || '',
        q5: state.answers.q5 || '',
        q6: state.answers.q6 || '',
        q7: state.answers.q7 || '',
        q8: state.answers.q8 || '',
        q9: state.answers.q9 || '',
        q10: state.answers.q10 || '',
        q11: state.answers.q11 || '',
        final_profile: state.result.key || '',
        pmf_signal: state.result.pmfSignal || '',
        tokens_balance: 25,
        app_version: 'v2.1'
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(() => {
        setTimeout(() => { state.step++; renderStep(); }, 600);
      }).catch(err => {
        console.error('Submit error', err);
        setTimeout(() => { state.step++; renderStep(); }, 600);
      });
    }

    // Dashboard View

          <div class="parent-code-box">
            <b style="font-family:'Prompt',sans-serif; font-size:13.5px; color:#7A5A00;">👨‍👩‍👧 Parent Link (เชื่อมต่อผู้ปกครอง)</b>

            <button class="btn ghost" style="padding:8px 12px; font-size:13px; margin:0 auto;" onclick="copyParentCode('${state.parentInviteCode}')">📋 คัดลอกรหัสแชร์ให้ผู้ปกครอง</button>

          <div class="action-btn-stack">
            <button class="btn" onclick="shareToLine()">📱 ส่งผลลัพธ์ใน LINE</button>
            <button class="btn ghost" style="border:1.5px solid var(--ink); color:var(--ink);" onclick="addOfficialLine()">➕ เพิ่ม LifeMap เป็นเพื่อน</button>
          </div>

          <span class="link-subtle" onclick="openSettings()">⚙️ ตั้งค่าและจัดการข้อมูลของฉัน</span>
        </div>
      `;
    }

    // Settings View
    function renderSettings() {
      const main = document.getElementById('mainContainer');
      main.innerHTML = `
        <div class="screen active">
          <h2>⚙️ ตั้งค่าและจัดการข้อมูล (Data Ownership)</h2>
          <p class="muted">ข้อมูลของคุณเป็นสิทธิ์ของคุณ 100% สามารถปรับแต่งการยินยอมหรือสั่งลบข้อมูลได้ทันที</p>

          <div class="card">
            <b style="font-family:'Prompt',sans-serif; font-size:15px;">การให้ความยินยอมปัจจุบัน</b>
            
            <div class="consent-group" style="margin-top:10px;">
              <div class="consent-item checked" style="cursor:default;">
                <input type="checkbox" checked disabled>
                <div class="consent-item-text">
                  <b>1. สร้าง Life Profile</b>

              <div class="consent-item ${state.consents.research ? 'checked' : ''}" onclick="toggleSetting('research')">

                  <b>2. ร่วมวิจัยกับ จุฬาฯ</b>
                  <span>อนุญาตใช้ข้อมูลวิจัยแบบไม่ระบุตัวตน</span>
                </div>
              </div>

              <div class="consent-item ${state.consents.parent_link ? 'checked' : ''}" onclick="toggleSetting('parent_link')">
                <input type="checkbox" ${state.consents.parent_link ? 'checked' : ''}>

                  <b>3. Parent Link</b>
                  <span>ให้ผู้ปกครองดูสรุปเชิงสนับสนุน</span>
                </div>
              </div>

          </div>

          <div class="card" style="border-color:#FFA8A8; background:#FFF5F5;">
            <b style="font-family:'Prompt',sans-serif; color:#D63031; font-size:15px;">🗑️ สิทธิ์การลบข้อมูล (Right to Erasure)</b>
            <p class="muted" style="color:#D63031; font-size:13px;">เมื่อกดปุ่มนี้ ระบบจะส่งคำขอลบข้อมูลคำตอบทั้งหมดออกจากฐานข้อมูล และล้างข้อมูลในเครื่องทันที</p>
            <button class="btn" style="background:#D63031; border-color:#D63031; color:#fff;" onclick="deleteMyData()">ลบข้อมูลของฉันถาวร</button>
          </div>

          <button class="btn ghost" style="margin-top:14px; width:100%;" onclick="state.step = steps.length - 1; renderStep();">← กลับไปที่สมุดชีวิต</button>
        </div>
      `;
    }

    function openSettings() {
      state.step = steps.length; // virtual settings step
      const main = document.getElementById('mainContainer');
      document.getElementById('progFill').style.width = '100%';
      document.getElementById('stepCount').textContent = 'ตั้งค่า';
      renderSettings();
      renderFooter();
    }

    function toggleSetting(key) {
      state.consents[key] = !state.consents[key];
      renderSettings();
    }

    function deleteMyData() {
      if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้')) {
        const payload = {
          action: 'delete',
          line_user_id: state.identity.line_user_id,
          full_name: state.identity.full_name
        };

        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).finally(() => {
          alert('ส่งคำขอลบข้อมูลเรียบร้อยแล้ว');
          window.location.reload();
        });
      }
    }

    // Helpers & Share
    function shareToLine() {
      if (typeof liff !== 'undefined' && liff.isInClient()) {
        liff.shareTargetPicker([{
          type: 'flex',
          altText: `Life Profile ของ ${state.identity.full_name}`,
          contents: {
            type: 'bubble',
            body: {
              type: 'box',
              layout: 'vertical',
              contents: [
                { type: 'text', text: '📔 LifeMap Future Profile', weight: 'bold', size: 'xs', color: '#1A1A1A' },
                { type: 'text', text: state.result.key, weight: 'bold', size: 'xl', color: state.result.data.accent, margin: 'md' },
                { type: 'text', text: state.result.data.nameTh, size: 'sm', color: '#666666', wrap: true },
                { type: 'separator', margin: 'lg' },
                { type: 'text', text: `สมุดชีวิตของ ${state.identity.full_name}`, size: 'xs', color: '#999999', margin: 'md' }
              ]
            }
          }
        }]).catch(err => console.log('Share error', err));
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('คัดลอกลิงก์ LifeMap เรียบร้อยแล้ว! สามารถวางแชร์ใน LINE ได้ทันที');
      }
    }

    function addOfficialLine() {
      window.open('https://lin.ee/Q3cMgjF', '_blank');
    }

    function copyParentCode(code) {
      const textToCopy = `สวัสดีครับ/ค่ะ ขอฝากคุณพ่อคุณแม่ช่วยดูสรุปผลลัพธ์ LifeMap สมุดชีวิตของหนู/ผม ได้ที่รหัส Parent Link: ${code}`;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          alert('คัดลอกรหัสผู้ปกครอง ' + code + ' เรียบร้อยแล้ว! สามารถวางส่งให้คุณพ่อคุณแม่ใน LINE ได้ทันที');
        }).catch(() => fallbackCopy(textToCopy, code));
      } else {
        fallbackCopy(textToCopy, code);
      }
    }

    function fallbackCopy(text, code) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        alert('คัดลอกรหัสผู้ปกครอง ' + code + ' เรียบร้อยแล้ว! สามารถวางส่งให้คุณพ่อคุณแม่ใน LINE ได้ทันที');
      } catch (err) {
        prompt('โปรดคัดลอกรหัสนี้ส่งให้ผู้ปกครอง:', text);
      }
      document.body.removeChild(textArea);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
